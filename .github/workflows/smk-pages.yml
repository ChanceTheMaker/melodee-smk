name: Publish Melodee SMK website and development candidate
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: smk-pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.repository == 'ChanceTheMaker/melodee-smk'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/smk_browser_test.mjs && node web/installer/test_smk37_public.mjs
      - run: node web/installer/test_install_flow.mjs && node web/installer/test_discovery.mjs
      - run: node web/test_storage_codec.mjs && python3 tests/smk_storage_audit_test.py
      - name: Check protected storage and initialization
        run: |
          for name in melodee_smk_storage_policy melodee_smk_storage melodee_smk_setup; do
            cc -O2 -std=c11 tests/${name}_test.c -o /tmp/$name
            /tmp/$name
          done
      - run: node web/test_panel_glide.mjs
      - run: python3 tools/make_smk_site.py build/smk-site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: build/smk-site
      - uses: actions/deploy-pages@v4
        id: deploy
